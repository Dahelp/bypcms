name: QA live catalog domain proofs only
on:
  workflow_dispatch:
    inputs:
      phase:
        description: publish or cleanup disposable proofs
        required: true
        type: choice
        options: [publish, cleanup]
      proofs:
        description: Public single-use domain challenges only, never keys
        required: false
        default: '[]'
permissions:
  contents: read
concurrency:
  group: bypcms-qa-catalog-271-20261118
  cancel-in-progress: false
jobs:
  domain-proof-files-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strictly scoped public JSON proofs
        shell: python
        env:
          PHASE: ${{ inputs.phase }}
          PROOFS: ${{ inputs.proofs }}
        run: |
          import json, os, re
          from pathlib import Path
          root=Path('qa-domain-proofs')
          root.mkdir()
          if os.environ['PHASE']=='publish':
              proofs=json.loads(os.environ['PROOFS'])
              assert len(proofs)==3 and {p['edition'] for p in proofs}=={'content','business','commerce'}
              for p in proofs:
                  assert re.fullmatch('[a-f0-9]{32}',p['id'])
                  assert re.fullmatch('[a-f0-9]{32}',p['installation_id'])
                  assert re.fullmatch('[a-f0-9]{64}',p['nonce'])
                  target=root/p['edition']/'.well-known'/'bypcms-activation'
                  target.mkdir(parents=True)
                  (target/(p['id']+'.json')).write_text(json.dumps({'installation_id':p['installation_id'],'nonce':p['nonce']}))
          else:
              assert os.environ['PHASE']=='cleanup'
      - name: Sync only the disposable QA directory
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: grass.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./qa-domain-proofs/
          server-dir: ../demo.bypcms.ru/_qa-update-20261118/
          state-name: .ftp-deploy-sync-state-qa-catalog-271.json
          log-level: minimal
          timeout: 60000
      - name: Mirror only the QA directory for the documented demo vhost alias
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: grass.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./qa-domain-proofs/
          server-dir: ./demo/_qa-update-20261118/
          state-name: .ftp-deploy-sync-state-qa-catalog-271.json
          log-level: minimal
          timeout: 60000
