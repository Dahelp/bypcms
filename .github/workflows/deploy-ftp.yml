name: Deploy BYPCMS website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bypcms-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PHP runtime
        run: find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify licensing and bulk policies
        run: php tests/shop.test.php && php tests/gallery-filters.test.php && php tests/business.test.php && php tests/content.test.php && php tests/commerce.test.php && php tests/license.test.php && php tests/license-client.test.php && php tests/panel-bulk.test.php && php tests/update-package.test.php

      - name: Build static website
        run: pnpm build:ftp

      - name: Verify panel startup and settings routes
        run: node --test tests/owner-commerce-route.test.mjs

      - name: Deploy to GoHost
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: grass.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: ./
          log-level: minimal
          timeout: 60000

      - name: Prepare standalone demo package
        run: pnpm prepare:demo

      - name: Deploy standalone demo
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: grass.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./demo-dist/
          server-dir: ../demo.bypcms.ru/
          state-name: .ftp-deploy-sync-state-demo.json
          log-level: standard
          timeout: 120000

      - name: Verify deployed application assets
        run: node scripts/verify-deployment.mjs

      - name: Verify deployed licensing API
        run: node scripts/verify-licensing-deployment.mjs

      - name: Verify deployed commerce boundaries
        run: node scripts/verify-commerce-deployment.mjs

      - name: Verify deployed Journal routes and assets
        run: node scripts/verify-journal-deployment.mjs

      - name: Verify deployed Business Atelier routes and assets
        run: node scripts/verify-business-deployment.mjs

      - name: Verify deployed Commerce Gallery routes and assets
        run: node scripts/verify-gallery-deployment.mjs
