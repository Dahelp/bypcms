name: Deploy BYPCMS website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bypcms-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm build:ftp

      - name: Deploy to GoHost
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: grass.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: ./
          log-level: minimal
          timeout: 60000

      - name: Prepare standalone demo package
        run: pnpm prepare:demo

      - name: Install reliable FTP mirror
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mirror demo.bypcms.ru
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" grass.gohost.ru <<'LFTP'
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --parallel=4 --verbose ./demo-dist/ ../demo.bypcms.ru/
          bye
          LFTP
